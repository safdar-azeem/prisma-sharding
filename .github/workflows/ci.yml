name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node tests + real PostgreSQL integration (prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The adaptive `migrate diff` arguments and the whole deploy/baseline
        # flow run against real CLIs from both supported major versions,
        # not mocked version-specific arguments.
        prisma: ['6', '7']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_sharding_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Always set in CI: the real-PostgreSQL integration tests are mandatory
      # here, never skipped.
      PS_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_sharding_it
      PS_IT_SHARDS: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pin Prisma major for this matrix leg
        run: yarn add --dev prisma@^${{ matrix.prisma }}

      - name: Build and run all tests (unit, CLI, real PostgreSQL integration)
        run: yarn test

      - name: Fail if integration tests were skipped
        run: |
          if [ -z "$PS_INTEGRATION_DATABASE_URL" ]; then
            echo "PS_INTEGRATION_DATABASE_URL must be set in CI"; exit 1;
          fi
